# Запуск: из корня репозитория — docker compose up --build

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpair}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-gateway:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: gateways/FinPair.ApiGateway/FinPair.ApiGateway.csproj
        ENTRY_DLL: FinPair.ApiGateway.dll
    ports:
      - "5194:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__Auth__BaseUrl: http://auth-service:8080
      Services__Couple__BaseUrl: http://couple-service:8080
      Services__Finance__BaseUrl: http://finance-service:8080
      Services__Goals__BaseUrl: http://goal-service:8080
      Services__Analytics__BaseUrl: http://analytics-service:8080
      Services__Support__BaseUrl: http://support-service:8080
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0}
    networks:
      - default
      - dokploy-network
    depends_on:
      - auth-service
      - couple-service
      - finance-service
      - goal-service
      - analytics-service
      - support-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Auth/FinPair.AuthService/FinPair.AuthService.csproj
        ENTRY_DLL: FinPair.AuthService.dll
    ports:
      - "5222:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
      Auth__Issuer: ${Auth__Issuer:-FinPair.AuthService}
      Auth__Audience: ${Auth__Audience:-FinPair.Api}
      Auth__AccessTokenLifetimeMinutes: ${Auth__AccessTokenLifetimeMinutes:-15}
      Auth__RefreshTokenLifetimeDays: ${Auth__RefreshTokenLifetimeDays:-30}
      Auth__RefreshCookieName: ${Auth__RefreshCookieName:-finpair.refresh_token}
      Auth__RefreshCookiePath: ${Auth__RefreshCookiePath:-/api/v1/auth}
      Auth__RefreshCookieSameSite: ${Auth__RefreshCookieSameSite:-Lax}
      Auth__RefreshCookieSecure: ${Auth__RefreshCookieSecure:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Analytics/FinPair.AnalyticsService/FinPair.AnalyticsService.csproj
        ENTRY_DLL: FinPair.AnalyticsService.dll
    ports:
      - "5053:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  couple-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Couple/FinPair.CoupleService/FinPair.CoupleService.csproj
        ENTRY_DLL: FinPair.CoupleService.dll
    ports:
      - "5116:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  finance-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Finance/FinPair.FinanceService/FinPair.FinanceService.csproj
        ENTRY_DLL: FinPair.FinanceService.dll
    ports:
      - "5071:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  goal-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Goals/FinPair.GoalService/FinPair.GoalService.csproj
        ENTRY_DLL: FinPair.GoalService.dll
    ports:
      - "5232:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # На части сборок Windows порт 5000 занят системой — при ошибке bind смените, например, на "5002:8080".
  support-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Support/FinPair.SupportService/FinPair.SupportService.csproj
        ENTRY_DLL: FinPair.SupportService.dll
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finpair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GssEncryptionMode=Disable
      Auth__SigningKey: ${Auth__SigningKey}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  postgres17_data:
