# Запуск: из корня репозитория — docker compose up --build
# PostgreSQL поднимается отдельно (локально или вне compose). Контейнеры подключаются к хосту.
#
# GssEncryptionMode=Disable: в Npgsql 10 по умолчанию Prefer — без Kerberos в образе dotnet
# подгружается libgssapi_krb5 и падает сборка/рантайм; парольная аутентификация не нуждается в GSS.
x-finpair-postgres-env: &finpair-postgres-env
  ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=host.docker.internal;Port=5432;Database=finpair;Username=postgres;Password=root;GssEncryptionMode=Disable}

services:
  # Одноразовое применение общих SQL-миграций до параллельного старта сервисов (иначе DbUp гонится за журнал).
  db-migrate:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: tools/FinPair.DbMigrate/FinPair.DbMigrate.csproj
        ENTRY_DLL: FinPair.DbMigrate.dll
    environment:
      <<: *finpair-postgres-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api-gateway:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: gateways/FinPair.ApiGateway/FinPair.ApiGateway.csproj
        ENTRY_DLL: FinPair.ApiGateway.dll
    ports:
      - "5194:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__Auth__BaseUrl: http://auth-service:8080
      Services__Couple__BaseUrl: http://couple-service:8080
      Services__Finance__BaseUrl: http://finance-service:8080
      Services__Goals__BaseUrl: http://goal-service:8080
      Services__Analytics__BaseUrl: http://analytics-service:8080
      Services__Support__BaseUrl: http://support-service:8080
    depends_on:
      - auth-service
      - couple-service
      - finance-service
      - goal-service
      - analytics-service
      - support-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Auth/FinPair.AuthService/FinPair.AuthService.csproj
        ENTRY_DLL: FinPair.AuthService.dll
    ports:
      - "5222:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
      Auth__RefreshCookieSecure: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  analytics-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Analytics/FinPair.AnalyticsService/FinPair.AnalyticsService.csproj
        ENTRY_DLL: FinPair.AnalyticsService.dll
    ports:
      - "5053:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  couple-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Couple/FinPair.CoupleService/FinPair.CoupleService.csproj
        ENTRY_DLL: FinPair.CoupleService.dll
    ports:
      - "5116:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  finance-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Finance/FinPair.FinanceService/FinPair.FinanceService.csproj
        ENTRY_DLL: FinPair.FinanceService.dll
    ports:
      - "5071:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  goal-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Goals/FinPair.GoalService/FinPair.GoalService.csproj
        ENTRY_DLL: FinPair.GoalService.dll
    ports:
      - "5232:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # На части сборок Windows порт 5000 занят системой — при ошибке bind смените, например, на "5002:8080".
  support-service:
    build:
      context: ./finpair-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: services/Support/FinPair.SupportService/FinPair.SupportService.csproj
        ENTRY_DLL: FinPair.SupportService.dll
    ports:
      - "5000:8080"
    environment:
      <<: *finpair-postgres-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningKey: finpair-local-development-signing-key-please-change
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
